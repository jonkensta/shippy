# Base URL of the IBP backend API. No API key is needed. Both forms work:
#   - behind nginx: http://192.168.1.156/api
#   - direct:       http://localhost:8000
# The return address and the unit (bulk) recipient name are not configured
# here: they come from the server's shipping settings, which volunteers can
# edit in the IBP web app.
[ibp]
url = http://192.168.1.156/api

[easypost]
apikey = your_easypost_api_key_here

[googlemaps]
apikey = your_api_key_here

# Declared parcel dimensions in inches. USPS requires all three dimensions;
# Library Mail is priced by weight alone, so these just need to be large
# enough for any package. This section is optional and defaults to the
# values shown below.
[parcel]
length = 20
width = 14
height = 10
