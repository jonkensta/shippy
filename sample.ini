# Base URL of the IBP FastAPI backend. Both forms work:
#   - direct:       http://localhost:8000
#   - behind nginx: https://example.org/api
# (the client normalizes the trailing slash, so the /api prefix is preserved)
[ibp]
url = http://localhost:8000
# Recipient name printed on unit (bulk) addresses. Optional; defaults to the
# value shown below.
#unit_address_name = ATTN: MAILROOM STAFF

[easypost]
apikey = your_easypost_api_key_here

[googlemaps]
apikey = your_api_key_here

# Organization return address printed on every shipment.
[return_address]
name = Inside Books Project
street1 = PO Box 301029
street2 =
city = Austin
state = Texas
zipcode = 78703

# Declared parcel dimensions in inches. USPS requires all three dimensions;
# Library Mail is priced by weight alone, so these just need to be large
# enough for any package. This section is optional and defaults to the
# values shown below.
[parcel]
length = 20
width = 14
height = 10
